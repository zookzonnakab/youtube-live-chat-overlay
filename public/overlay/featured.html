<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Featured Chat Overlay</title>
  <link rel="stylesheet" href="/overlay/featured.css" />
</head>
<body>
  <div id="featured-card" class="featured-card hidden">
    <div class="featured-label">CHAT</div>
    <div class="featured-header">
      <img id="featured-avatar" class="featured-avatar" src="" alt="" />
      <div class="featured-meta">
        <div class="featured-user-row">
          <span id="featured-username" class="featured-username"></span>
          <img id="featured-badge" class="featured-badge hidden" src="" alt="" />
          <span id="featured-badge-label" class="featured-badge-label hidden"></span>
        </div>
      </div>
    </div>
    <div id="featured-body" class="featured-body"></div>
  </div>
  <script src="/overlay/overlay-client.js"></script>
  <script src="/overlay/featured.js"></script>
</body>
</html>
