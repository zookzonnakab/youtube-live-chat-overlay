<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TTS Overlay</title>
  <link rel="stylesheet" href="/overlay/tts.css" />
</head>
<body>
  <div id="tts-unlock" class="tts-unlock" role="button" tabindex="0">
    <div class="tts-unlock-title">ต้องเปิดเสียงครั้งแรก</div>
    <div class="tts-unlock-body">
      ใน OBS: คลิกขวา Browser TTS → <b>Interact</b> → คลิกที่นี่<br />
      ใน Chrome: คลิกที่นี่ได้เลย
    </div>
  </div>

  <div id="tts-card" class="tts-card hidden">
    <div id="tts-category" class="tts-category"></div>
    <div id="tts-display" class="tts-display"></div>
    <div class="tts-progress"><div id="tts-progress-bar" class="tts-progress-bar"></div></div>
  </div>

  <audio id="tts-audio" preload="auto" playsinline></audio>

  <script src="/overlay/overlay-client.js"></script>
  <script src="/overlay/tts.js"></script>
</body>
</html>
